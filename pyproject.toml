[project]
name = "gitbeak-mcp"
version = "0.1.0"
description = "Go-based MCP server for OpenBeak governance APIs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
gitbeak-mcp = "openbeak_mcp.runner:main"

[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openbeak_mcp"]
